# electron-builder config (plan §F M6). Targets: deb + AppImage (Linux), nsis (Win), dmg (Mac).
appId: com.internal.potato
productName: Potato

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json
  - "!src/**"
  - "!*.md"
  - "!electron.vite.config.ts"
  - "!tsconfig*.json"

npmRebuild: false

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: neonn0d
  icon: resources/icon.png

win:
  target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true

mac:
  target: dmg
  category: public.app-category.developer-tools
